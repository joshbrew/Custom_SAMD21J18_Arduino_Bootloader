# Runtime body for the no-flash SWD probe. Generated swd_probe.cfg supplies inputs.
set J18_CONNECTED 0
set J18_BP ""
set J18_FAILED 0
proc j18_result {name status description} {
    if {$status eq "FAIL"} { set ::J18_FAILED 1 }
    echo "J18_RESULT|$name|$status|$description"
}
proc j18_value {name value} { echo "J18_VALUE|$name|$value" }
proc j18_snapshot {label} {
    echo "--- CPU snapshot: $label ---"
    reg
    set values [get_reg {pc lr msp psp xpsr control}]
    foreach name {pc lr msp psp xpsr control} { j18_value "$label.$name" [dict get $values $name] }
    set active [expr {[lindex [read_memory 0xE000ED04 32 1] 0] & 511}]
    j18_value "$label.active_exception" $active
    if {$active == 3} { j18_result "$label.exception" FAIL "CPU is in HardFault; inspect the PC, LR and stack." }
    set vtor [lindex [read_memory 0xE000ED08 32 1] 0]
    j18_value "$label.vtor" [format 0x%08x $vtor]
    if {$active == 3} {
        set lr [dict get $values lr]
        if {$lr == 0xfffffff1 || $lr == 0xfffffff9 || $lr == 0xfffffffd} {
            set source [expr {($lr & 4) ? "psp" : "msp"}]
            set frame_sp [dict get $values $source]
            if {$frame_sp >= 0x20000000 && $frame_sp+32 <= $::SWD_RAM_END && ($frame_sp % 4) == 0} {
                set frame [read_memory $frame_sp 32 8]
                j18_value "$label.frame.source" $source
                j18_value "$label.frame.sp" [format 0x%08x $frame_sp]
                foreach field {r0 r1 r2 r3 r12 lr pc xpsr} word $frame {
                    j18_value "$label.frame.$field" [format 0x%08x $word]
                }
            } else { j18_value "$label.frame.note" "Exception frame pointer is outside detected RAM; not read." }
        } else { j18_value "$label.frame.note" "LR is not a supported EXC_RETURN; raw stack retained without assuming a frame." }
        if {($vtor % 128) == 0 && (($vtor >= 0 && $vtor+64 <= $::SWD_FLASH_BYTES) || ($vtor >= 0x20000000 && $vtor+64 <= $::SWD_RAM_END))} {
            set vectors [read_memory $vtor 32 16]
            j18_value "$label.vector_words" $vectors
            j18_value "$label.hardfault_handler" [format 0x%08x [lindex $vectors 3]]
        }
    }
    j18_value "$label.reset_cause" [format 0x%02x [lindex [read_memory 0x40000438 8 1] 0]]
    # PORT direction/output/input only; no pins are driven by this probe.
    foreach {name base} {PORTA 0x41004400 PORTB 0x41004480} {
        foreach {field offset} {DIR 0 OUT 16 IN 32} {
            j18_value "$label.$name.$field" [format 0x%08x [lindex [read_memory [expr {$base+$offset}] 32 1] 0]]
        }
    }
    if {[info exists ::J18_PINS]} {
        foreach {alias group pin} $::J18_PINS {
            set base [expr {0x41004400 + $group*128}]
            set config [lindex [read_memory [expr {$base+64+$pin}] 8 1] 0]
            set pair [lindex [read_memory [expr {$base+48+($pin/2)}] 8 1] 0]
            set mux [expr {($pair >> (4*($pin % 2))) & 15}]
            j18_value "$label.pin.$alias" [format "PINCFG=0x%02x PMUX=%d enabled=%d" $config $mux [expr {$config & 1}]]
        }
    }
    # Raw PORT positions are valid registers; not all positions are bonded pins.
    if {$::SWD_BOARD_MAP eq "generic"} {
        for {set group 0} {$group < 2} {incr group} {
            set base [expr {0x41004400 + $group*128}]
            for {set pin 0} {$pin < 32} {incr pin} {
                set name [format "P%s%02d" [lindex {A B} $group] $pin]
                set config [lindex [read_memory [expr {$base+64+$pin}] 8 1] 0]
                set pair [lindex [read_memory [expr {$base+48+($pin/2)}] 8 1] 0]
                j18_value "$label.pin.$name" [format "PINCFG=0x%02x PMUX=%d enabled=%d" $config [expr {($pair >> (4*($pin % 2))) & 15}] [expr {$config & 1}]]
            }
        }
    }
    foreach {name offset} {APBAMASK 24 APBBMASK 28 APBCMASK 32} {
        j18_value "$label.$name" [format 0x%08x [lindex [read_memory [expr {0x40000400+$offset}] 32 1] 0]]
    }
    set apba [lindex [read_memory 0x40000418 32 1] 0]
    if {$apba & 4} {
        set status [lindex [read_memory 0x4000080C 32 1] 0]
        set external [lindex [read_memory 0x40000814 16 1] 0]
        j18_value "$label.SYSCTRL.PCLKSR" [format 0x%08x $status]
        j18_value "$label.SYSCTRL.XOSC32K" [format 0x%04x $external]
        j18_value "$label.XOSC32K.enabled" [expr {($external >> 1) & 1}]
        j18_value "$label.XOSC32K.ready" [expr {($status >> 1) & 1}]
        foreach {field offset width} {OSC32K 24 32 DFLLCTRL 36 16 DFLLVAL 40 32 DFLLMUL 44 32} {
            j18_value "$label.SYSCTRL.$field" [format 0x%08x [lindex [read_memory [expr {0x40000800+$offset}] $width 1] 0]]
        }
    }
    if {$apba & 8} {
        j18_value "$label.GCLK.CTRL" [format 0x%02x [lindex [read_memory 0x40000C00 8 1] 0]]
        j18_value "$label.GCLK.STATUS" [format 0x%02x [lindex [read_memory 0x40000C01 8 1] 0]]
    }
    set peripheral_clocks [lindex [read_memory 0x40000420 32 1] 0]
    for {set index 0} {$index < 6} {incr index} {
        if {!(($peripheral_clocks >> ($index+2)) & 1)} {
            j18_value "$label.SERCOM$index" "APB clock disabled; register reads skipped."
            continue
        }
        set base [expr {0x42000800+$index*1024}]
        foreach {field offset width} {CTRLA 0 32 CTRLB 4 32 BAUD 12 16} {
            j18_value "$label.SERCOM$index.$field" [format 0x%08x [lindex [read_memory [expr {$base+$offset}] $width 1] 0]]
        }
    }
    set sp [dict get $values msp]
    if {$sp >= 0x20000000 && $sp < $::SWD_RAM_END && ($sp % 4) == 0} {
        set count [expr {($::SWD_RAM_END-$sp)/4}]
        if {$count > 16} { set count 16 }
        j18_value "$label.stack_words" [read_memory $sp 32 $count]
    }
}
proc j18_vectors {label base alignment lower upper} {
    set words [read_memory $base 32 2]
    set sp [lindex $words 0]
    set reset [lindex $words 1]
    j18_value "$label.sp" [format 0x%08x $sp]
    j18_value "$label.reset" [format 0x%08x $reset]
    if {$sp <= 0x20000000 || $sp > $::SWD_RAM_END || ($sp % $alignment) || !($reset & 1) ||
        ($reset & ~1) < $lower || ($reset & ~1) >= $upper} {
        j18_result "$label.vectors" FAIL "Invalid stack/reset vector for detected $::SWD_CHIP and the selected application offset."
        return -1
    }
    j18_result "$label.vectors" PASS "Stack and Thumb reset address are in range."
    return [expr {$reset & ~1}]
}
proc j18_compare {label file base} {
    if {$file eq ""} {
        j18_result "$label.flash" SKIP "No saved local image; installed bytes cannot be compared."
        return 0
    }
    if {$base+[file size $file] > $::SWD_FLASH_BYTES} {
        j18_result "$label.flash" FAIL "Local image exceeds detected flash capacity; comparison skipped."
        return 0
    }
    set stream [open $file rb]
    set bytes [read $stream 8]
    close $stream
    binary scan $bytes c8 vector
    set sp 0
    set reset 0
    for {set i 0} {$i < 4} {incr i} {
        set sp [expr {$sp | (([lindex $vector $i] & 255) << (8*$i))}]
        set reset [expr {$reset | (([lindex $vector [expr {$i+4}]] & 255) << (8*$i))}]
    }
    j18_value "expected.$label.sp" [format 0x%08x $sp]
    j18_value "expected.$label.reset" [format 0x%08x $reset]
    if {$sp <= 0x20000000 || $sp > $::SWD_RAM_END} {
        j18_result "$label.flash" FAIL "Local image stack does not fit detected $::SWD_CHIP RAM; use a matching compilation."
        return 0
    }
    if {[catch {verify_image $file $base bin} reason]} {
        j18_result "$label.flash" FAIL "Installed image differs from selected local binary, or flash read failed: $reason. This is not by itself proof of corruption."
        return 0
    }
    j18_result "$label.flash" PASS "Installed flash matches the saved image."
    return 1
}
proc j18_checkpoint {name address} {
    # A raw app at zero may already be halted at its reset handler. Do not
    # resume past that address and then falsely wait for it to be reached again.
    set current [expr {[dict get [get_reg {pc}] pc] & ~1}]
    if {$name ne "loop_again" && $current == $address} {
        j18_result $name PASS [format "Already halted at checkpoint 0x%08x." $address]
        return 1
    }
    set ::J18_BP $address
    bp $address 2 hw
    resume
    set timed_out [catch {wait_halt $::J18_TIMEOUT_MS} reason]
    halt 5000
    set pc [expr {[dict get [get_reg {pc}] pc] & ~1}]
    rbp $address
    set ::J18_BP ""
    if {!$timed_out && $pc == $address} {
        j18_result $name PASS [format "Reached hardware breakpoint at 0x%08x." $address]
        return 1
    }
    j18_result $name FAIL [format "Did not reach checkpoint within %d ms; PC=0x%08x. Could be a wait, fault, reset, or bootloader mode." $::J18_TIMEOUT_MS $pc]
    j18_snapshot $name
    return 0
}
proc j18_probe {} {
    echo "1. Connecting and halting CPU; flash is not erased or programmed."
    init
    set ::J18_CONNECTED 1
    if {[info exists ::J18_CONNECT_UNDER_RESET] && $::J18_CONNECT_UNDER_RESET} {
        reset halt
        j18_result recovery_reset PASS "Connected under wired NRST and released hardware reset into halt."
    }
    halt 5000
    targets
    j18_result connection PASS "Debug port connected and CPU halted."
    set cpuid [lindex [read_memory 0xE000ED00 32 1] 0]
    set did [lindex [read_memory 0x41002018 32 1] 0]
    j18_value CPUID [format 0x%08x $cpuid]
    j18_value DSU_DID [format 0x%08x $did]
    set identity_ok 1
    if {(($cpuid >> 4) & 4095) == 0xC60} {
        j18_result cpu_identity PASS "Cortex-M0+ CPU identification."
    } else { j18_result cpu_identity FAIL "Unexpected CPU ID; expected Cortex-M0+."; set identity_ok 0 }
    # Decode family and DEVSEL independently from the die/revision fields.
    set processor [expr {($did >> 28) & 15}]
    set family [expr {($did >> 23) & 31}]
    set series [expr {($did >> 16) & 63}]
    set devsel [expr {$did & 255}]
    j18_value chip.revision [expr {($did >> 8) & 15}]
    if {$processor != 1 || $family != 0 || $series != 1 || ![dict exists $::SWD_DEVICES $devsel]} {
        j18_result chip_identity FAIL "Unsupported device for the SAMD21 backend; raw DID is recorded. Extend the device catalog/register backend with verified geometry."
        set identity_ok 0
    } else {
        set part [dict get $::SWD_DEVICES $devsel]
        set ::SWD_CHIP [lindex $part 0]
        set ::SWD_FLASH_BYTES [lindex $part 1]
        set ::SWD_RAM_END [expr {0x20000000+[lindex $part 2]}]
        j18_value chip.name $::SWD_CHIP
        j18_value chip.flash_bytes $::SWD_FLASH_BYTES
        j18_value chip.ram_bytes [lindex $part 2]
        j18_result chip_identity PASS "Detected $::SWD_CHIP; flash=$::SWD_FLASH_BYTES bytes, RAM=[lindex $part 2] bytes."
    }
    if {!$identity_ok} { return }
    set param [lindex [read_memory 0x41004008 32 1] 0]
    set ::SWD_PAGE_BYTES [expr {8 << (($param >> 16) & 7)}]
    set physical_size [expr {$::SWD_PAGE_BYTES * ($param & 65535)}]
    j18_value chip.nvm_param [format 0x%08x $param]
    if {$physical_size != $::SWD_FLASH_BYTES} {
        j18_result memory_geometry FAIL "NVMCTRL reports $physical_size flash bytes; DID table reports $::SWD_FLASH_BYTES. Remaining memory checks skipped."
        return
    }
    j18_result memory_geometry PASS "NVM page count/size confirms detected flash capacity."
    if {$::SWD_APP_OFFSET >= $::SWD_FLASH_BYTES-8} {
        j18_result application_layout FAIL "Selected application offset is outside the detected flash capacity."
        return
    }
    if {$::SWD_BOARD_MAP eq "custom" && ![string match SAMD21J* $::SWD_CHIP]} {
        set ::SWD_BOARD_MAP generic
        set ::J18_PINS {}
        j18_result pin_map SKIP "Custom aliases do not apply to the detected package; using raw PA/PB register positions."
    } else {
        j18_result pin_map PASS "Selected $::SWD_BOARD_MAP display map; physical board wiring is not auto-detected."
    }
    j18_value pin_map $::SWD_BOARD_MAP
    flash info 0
    j18_snapshot attached
    echo "2. Reading vectors, boot protection and saved-image comparisons."
    if {!$::SWD_VALIDATE_LAYOUT} {
        set boot_entry 0
        set app_entry 0
        j18_result boot.vectors SKIP "General inspection: no bootloader/application layout is assumed."
        j18_result app.vectors SKIP "General inspection: select an application offset and full probe to validate startup vectors."
        dump_image $::J18_BOOT_DUMP 0 64
    } elseif {$::SWD_APP_OFFSET} {
        set boot_entry [j18_vectors boot 0 4 0 $::SWD_APP_OFFSET]
        set app_entry [j18_vectors app $::SWD_APP_OFFSET 8 $::SWD_APP_OFFSET $::SWD_FLASH_BYTES]
        dump_image $::J18_BOOT_DUMP 0 64
    } else {
        set boot_entry 0
        set app_entry [j18_vectors app $::SWD_APP_OFFSET 8 $::SWD_APP_OFFSET $::SWD_FLASH_BYTES]
        j18_result boot.vectors SKIP "Application starts at zero; no separate bootloader region selected."
    }
    dump_image $::J18_APP_DUMP $::SWD_APP_OFFSET 64
    set user [lindex [read_memory 0x00804000 32 1] 0]
    set prot [expr {$user & 7}]
    j18_value BOOTPROT $prot
    set protected [expr {$prot == 7 ? 0 : (2 << (8-$prot))*$::SWD_PAGE_BYTES}]
    j18_value BOOTPROT.bytes $protected
    set expected $::SWD_EXPECT_BOOT_BYTES
    if {$expected >= 0 && $protected != $expected} {
        j18_result boot_protection FAIL "Observed $protected protected bytes; selected policy expects $expected. Fuses unchanged."
    } else { j18_result boot_protection PASS "Observed $protected protected bytes (code $prot); fuses unchanged." }
    j18_compare boot $::J18_BOOT_IMAGE 0
    set app_match [j18_compare app $::J18_APP_IMAGE $::SWD_APP_OFFSET]
    if {[info exists ::SWD_SCAN_BYTES] && $::SWD_SCAN_BYTES > 0} {
        set count [expr {$::SWD_SCAN_BYTES < $::SWD_FLASH_BYTES ? $::SWD_SCAN_BYTES : $::SWD_FLASH_BYTES}]
        echo "Image scan: Reading $count flash bytes once for local binary identification; CPU is paused."
        if {[catch {dump_image $::SWD_SCAN_DUMP 0 $count} reason]} {
            j18_result image.scan FAIL "Flash read failed: $reason"
        } else {
            j18_value image.scan_bytes $count
            j18_result image.scan PASS "Installed flash captured for complete binary-range comparisons."
        }
    }
    if {$::J18_INSPECT_ONLY} {
        foreach stage {software_reset app_entry setup loop loop_again} { j18_result $stage SKIP "Inspect-only mode; no reset/startup sequence." }
        return
    }
    echo "3. One software reset, then hardware breakpoints through startup."
    if {$boot_entry < 0 || $app_entry < 0} {
        foreach stage {software_reset app_entry setup loop loop_again} { j18_result $stage SKIP "Invalid boot/app vectors; startup sequence skipped." }
        return
    }
    reset halt
    if {[info exists ::J18_CONNECT_UNDER_RESET] && $::J18_CONNECT_UNDER_RESET} {
        j18_result software_reset PASS "Startup reset/halt succeeded using the wired reset configuration."
    } else { j18_result software_reset PASS "SYSRESETREQ reset and halt succeeded without a reset wire." }
    if {![j18_checkpoint app_entry $app_entry]} {
        foreach stage {setup loop loop_again} { j18_result $stage SKIP "Application reset handler was not reached." }
        return
    }
    if {!$app_match || !$::J18_SYMBOLS_MATCH} {
        foreach stage {setup loop loop_again} { j18_result $stage SKIP "Need a matching saved app and ELF symbols for named checkpoints." }
        return
    }
    set names {setup loop loop_again}
    foreach name $names address [list $::J18_SETUP $::J18_LOOP $::J18_LOOP] {
        if {$address == 0} { j18_result $name SKIP "Symbol absent, possibly removed by optimization."; continue }
        if {![j18_checkpoint $name $address]} {
            set position [lsearch -exact $names $name]
            foreach later [lrange $names [expr {$position+1}] end] {
                j18_result $later SKIP "Earlier startup checkpoint was not reached."
            }
            return
        }
    }
    j18_snapshot startup_end
}
set J18_ERROR [catch {j18_probe} J18_REASON]
if {$J18_ERROR} {
    if {$J18_REASON eq ""} { set J18_REASON "OpenOCD target initialization/CPU halt failed; see the preceding adapter error." }
    if {$J18_CONNECTED} { j18_result probe_runtime FAIL $J18_REASON } else { j18_result connection FAIL $J18_REASON }
}
if {[info exists J18_CONNECT_UNDER_RESET] && $J18_CONNECT_UNDER_RESET && $J18_ERROR} {
    # Execution-stage adapter commands are unavailable when init failed.
    if {!$J18_CONNECTED} {
        j18_result reset_release SKIP "OpenOCD initialization failed; reset release cannot be commanded. Disconnect NRST and power-cycle target."
    } elseif {[catch {adapter deassert srst} reason]} {
        j18_result reset_release FAIL "Could not confirm reset release after failed connection; disconnect NRST/power-cycle target."
    } else { j18_result reset_release PASS "Adapter reset output deasserted after failed connection." }
}
# Remove only our own hardware breakpoint, including timeout/error paths.
if {$J18_CONNECTED} {
    if {$J18_BP ne ""} { catch {halt 5000}; catch {rbp $J18_BP} }
    if {$J18_LEAVE_HALTED} {
        if {[catch {halt 5000} reason]} { j18_result cleanup FAIL $reason } else {
            j18_result cleanup PASS "CPU left halted for inspection; firmware is not running."
        }
    } else {
        if {[catch {resume} reason]} { j18_result cleanup FAIL $reason } else {
            j18_result cleanup PASS "Probe breakpoints removed and CPU resumed without another reset."
        }
    }
}
if {$J18_FAILED} { shutdown error } else { shutdown }
