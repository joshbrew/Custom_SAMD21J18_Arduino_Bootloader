# BOOT_IMAGE and APP_IMAGE may be provided with -c "set ..." before this file.
# A boot-only run preserves the existing application at 0x2000.
if {![info exists BOOT_IMAGE]} {
    set BOOT_IMAGE [file join [file dirname [string map {\\ /} [info script]]] firmware samd21_sam_ba.bin]
}
# Jim Tcl in some Windows OpenOCD builds cannot normalize otherwise valid paths.
# file join plus the explicit cfg path works without normalization.
proc j18_check_image {path base max_bytes} {
    if {![file exists $path] || [file size $path] < 8 || [file size $path] > $max_bytes} {
        error "Missing/invalid image size: $path"
    }
    set stream [open $path rb]
    set vector [read $stream 8]
    close $stream
    binary scan $vector c8 bytes
    set sp 0
    set pc 0
    for {set i 0} {$i < 4} {incr i} {
        set sp [expr {$sp | (([lindex $bytes $i] & 255) << (8*$i))}]
        set pc [expr {$pc | (([lindex $bytes [expr {$i+4}]] & 255) << (8*$i))}]
    }
    set stack_mask [expr {$base == 0 ? 3 : 7}]
    if {$sp <= 0x20000000 || $sp > 0x20008000 || ($sp & $stack_mask) || !($pc & 1) || ($pc & ~1) < $base || ($pc & ~1) >= ($base+[file size $path])} {
        error "Invalid vectors / wrong image offset: $path"
    }
}
j18_check_image $BOOT_IMAGE 0 8192
if {[info exists APP_IMAGE]} {
    j18_check_image $APP_IMAGE 8192 253952
}
set CHIPNAME at91samd21j18
source [find target/at91samdXX.cfg]
# Target scripts can change the speed, so apply ours after sourcing the target.
if {![info exists J18_SWD_KHZ]} { set J18_SWD_KHZ 100 }
adapter speed $J18_SWD_KHZ
reset_config none
cortex_m reset_config sysresetreq
if {[info exists J18_CHECK_ONLY] && $J18_CHECK_ONLY} {
    echo "Custom image vectors and OpenOCD configuration checked; no probe opened."
    shutdown
    return
}
init
reset halt
at91samd bootloader 0
reset halt
program $BOOT_IMAGE 0x00000000 verify
if {[info exists APP_IMAGE]} {
    program $APP_IMAGE 0x00002000 verify
}
at91samd bootloader 8192
reset halt
verify_image $BOOT_IMAGE 0x00000000 bin
reset run
shutdown
