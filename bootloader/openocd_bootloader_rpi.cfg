# Raspberry Pi 4: BCM8 SWDIO -> PA31, BCM11 SWCLK -> PA30, common GND.
# Requires an OpenOCD build with bcm2835gpio; run with GPIO access privileges.
adapter driver bcm2835gpio
transport select swd
if {[catch {adapter gpio swdio 8 -chip 0}]} {
    bcm2835gpio_swd_nums 11 8
} else {
    adapter gpio swclk 11 -chip 0
}
source [file join [file dirname [string map {\\ /} [info script]]] openocd_bootloader_common.cfg]
