# ST-LINK SWDIO -> PA31, SWCLK -> PA30, common GND; target powered at 3.3 V.
# No reset wire required for this software-reset workflow.
# Direct DAP driver: avoids the old HLA-only stlink.cfg on stock OpenOCD 0.12.
# Newer builds call the transport swd; 0.12 calls it dapdirect_swd.
adapter driver st-link
st-link vid_pid 0x0483 0x3744 0x0483 0x3748 0x0483 0x374b 0x0483 0x374d 0x0483 0x374e 0x0483 0x374f 0x0483 0x3752 0x0483 0x3753 0x0483 0x3754 0x0483 0x3755 0x0483 0x3757
if {[catch {transport select swd}]} { transport select dapdirect_swd }
source [file join [file dirname [string map {\\ /} [info script]]] openocd_bootloader_common.cfg]
